# OpenRC startup requirements for the upstream J413 speaker protection daemon.
# shellcheck disable=SC2034 # Read by OpenRC.
rc_need="udev-trigger"

# 保护进程退出后扬声器就失去限幅保护，必须由 OpenRC 重新拉起（D1-5）。
# respawn_max=0 = 无限次；5 秒延迟防止瞬时崩溃刷屏。
# 注意：这要求上游 init 脚本以前台方式运行（supervise-daemon 不能监督
# 自行 daemonize 的进程）。真机上用 `kill` 一次 speakersafetyd 验证会被拉起。
supervisor=supervise-daemon
respawn_delay=5
respawn_max=0

ordo_j413_alsa_ready() {
    for card in /sys/class/sound/card[0-9]*; do
        [ -r "$card/id" ] && [ "$(cat "$card/id")" = AppleJ413 ] || continue
        number=${card##*/card}
        control=/dev/snd/controlC$number
        sense=/dev/snd/pcmC${number}D2c
        [ -c "$control" ] && [ -c "$sense" ] || continue
        # The protection process must be able to open the mixer and the
        # voltage/current sense capture PCM. Do not open either here.
        runuser -u speakersafetyd -- sh -c \
            '[ -r "$1" ] && [ -w "$1" ] && [ -r "$2" ]' sh "$control" "$sense" && return 0
    done
    return 1
}

start_pre() {
    if [ ! -r /proc/device-tree/compatible ] ||
       ! tr '\000' '\n' < /proc/device-tree/compatible | grep -Fxq apple,j413; then
        eerror 'speakersafetyd 需要 MacBook Air M2 J413 的设备树'
        return 1
    fi

    # The daemon records cold initialization once per boot in this directory.
    checkpath -d -m 0750 -o speakersafetyd:audio /run/speakersafetyd || return 1
    # 5 秒→20 秒：M2 冷启动时 udev/alsa 就绪可能远慢于 5 秒，旧值会在
    # 声音设备还没出现时直接判失败（D1-5）。20 秒仍远短于一次人工排查。
    attempts=0
    while ! ordo_j413_alsa_ready; do
        if [ "$attempts" -ge 100 ]; then
            eerror '等待 J413 ALSA 控制与扬声器感测设备超时（20 秒）'
            return 1
        fi
        sleep 0.2
        attempts=$((attempts + 1))
    done
}
