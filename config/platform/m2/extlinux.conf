TIMEOUT 30
DEFAULT ordo-external

LABEL ordo-external
  MENU LABEL Ordo external installer (manual confirmation)
  KERNEL /live/vmlinuz-asahi
  INITRD /live/initramfs-external.img
  APPEND console=tty0 loglevel=4

LABEL ordo-manual
  MENU LABEL Gentoo Live (manual)
  KERNEL /live/vmlinuz-asahi
  INITRD /live/initramfs-live-manual.img
  APPEND console=tty0 loglevel=4
