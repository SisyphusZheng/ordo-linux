# Ordo — xdg-desktop-portal 后端选择
#
# 文件选择器、截图、录屏由 umbriel 门户提供；其余接口统一走 gtk。
# 生效顺序：~/.config/xdg-desktop-portal/portals.conf 优先于
# /etc/xdg-desktop-portal/portals.conf（xdg-desktop-portal 的 XDG 查找规则）。
# 会话入口 ordo-umbriel-session 每次登录把本文件落成用户级副本；
# M2 安装器另外落一份系统级文件。doctor 会验收三项都指向 umbriel。
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=umbriel
org.freedesktop.impl.portal.Screenshot=umbriel
org.freedesktop.impl.portal.ScreenCast=umbriel
