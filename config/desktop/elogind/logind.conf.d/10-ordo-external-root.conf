# Ordo — 外接 USB 根池的睡眠策略（install-external.sh 仅在根池非 NVMe 时安装）
#
# 为什么整段禁睡：睡眠/唤醒会让 USB 控制器重新枚举，外接根池掉线后桌面卡在
# 根文件系统 I/O 上，只能长按断电（D0-2）。swap 只有 4G 且在同一块外接盘上，
# 也确实不够休眠（8G 内存），所以四个入口全部改成 ignore：
#   - 合盖（电池 / 外接电源两种状态）；
#   - 手动睡眠键；
#   - 手动休眠键。
# 需要缓解功耗时用关机，不要用 loginctl suspend。唤醒后的人工复检步骤见
# docs/manual/10-m2-external.md 的「唤醒之后」一节。
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
