# Ordo — noctalia-greeter 状态目录的 tmpfiles 覆盖
#
# GURU 的 noctalia-greeter 包自带 /usr/lib/tmpfiles.d/noctalia-greeter.conf，
# 但它硬编码 greeter:greeter 属主；Ordo 用 greetd 用户跑 greeter
# （config.toml 里 user = "greetd"，包没有创建 greeter 用户），
# 所以包的规则永远建不出目录 → greeter 回落到出厂默认外观。
# 此文件覆盖 /etc/tmpfiles.d/，属主改成 greetd。
# 2026-11-22 实机：缺它时 /var/lib/noctalia-greeter 不存在，
# greeter 不吃 sync.toml（壁纸/调色板同步无效）。
d /var/lib/noctalia-greeter 0750 greetd greetd -
