# Ordo Linux — tmux 配置
# 配色与 WezTerm / 壁纸同源：Catppuccin Mocha

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # 真彩色
set -g base-index 1                          # 窗口从 1 开始
setw -g pane-base-index 1                    # 窗格从 1 开始
set -g renumber-windows on                   # 关窗口后自动重编号
set -g history-limit 50000                   # 滚动缓冲
set -g mouse on                              # 鼠标选窗格/滚动/拖边框
set -g focus-events on
set -g set-clipboard on

set -g prefix C-b
bind C-b send-prefix
bind C-a send-prefix

# ============ 窗格分割（更直观的键）============
bind | split-window -h -c "#{pane_current_path}"   # 竖分
bind - split-window -v -c "#{pane_current_path}"   # 横分
bind c new-window -c "#{pane_current_path}"        # 新窗口保持当前目录

# ============ 窗格切换（vim 风格）============
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============ 窗格调整大小（重复按可持续调整）============
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Tab next-window
bind -r BTab previous-window

bind r source-file ~/.tmux.conf \; display "配置已重载"

# ============ 配色（Catppuccin Mocha）============
# 调色板
# base #1e1e2e  mantle #181825  crust #11111b
# surface0 #313244  surface1 #45475a  surface2 #585b70
# text #cdd6f4  subtext1 #bac2de  subtext0 #a6adc8
# blue #89b4fa  lavender #b4befe  sapphire #74c7ec
# green #a6e3a1  yellow #f9e2af  peach #fab387
# red #f38ba8  mauve #cba6f7  teal #94e2d5

状态栏
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 80
set -g status-justify left
set -g status-interval 5

# 左：会话名（带 Ordo 标记）
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] ORDO #[bg=#313244,fg=#89b4fa] #S #[default] "

# 右：时间 + 日期 + 主机
set -g status-right "#[fg=#a6adc8]#{?client_prefix,#[fg=#f9e2af]PREFIX #[default],} #[fg=#94e2d5]%H:%M #[fg=#6c7086]│ #[fg=#bac2de]%m-%d #[fg=#6c7086]│ #[fg=#cba6f7]#H "

窗口列表
set -g window-status-format "#[fg=#6c7086] #I #[fg=#a6adc8]#W "
set -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I #W #[default]"
set -g window-status-separator ""

窗格边框
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status off

消息与命令提示
set -g message-style "bg=#313244,fg=#f9e2af"
set -g message-command-style "bg=#313244,fg=#89b4fa"

复制模式（vi 风格）----
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# 新窗口/窗格不继承旧的环境变量污染
set -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# 关闭确认
bind x confirm-before -p "关闭窗格 #P? (y/n)" kill-pane
bind & confirm-before -p "关闭窗口 #W? (y/n)" kill-window

# 快速跳转最后一个窗格
# 注意：; 在 tmux 里是命令分隔符，必须转义或加引号
bind ';' select-pane -l
bind o select-pane -t :.+
