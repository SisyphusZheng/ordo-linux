name: CI

# Ordo 的 CI 只做一件事：**让「我这儿能跑」变成「任何人都能验证它能跑」**。
# 三条门禁分别守：
#   lint      —— 语法/风格/配置可解析（秒级反馈）
#   test      —— 本次评审每个 P0/P1 的回归用例
#   selfcheck —— CLI 表与实现一致（防止 usage 再次漂移）

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: lint + test + selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck 与 python3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3

      - name: L1 lint（语法 + shellcheck + 配置解析 + 声明层格式）
        run: sh tests/lint.sh

      - name: L2 行为测试（防回归用例）
        run: sh tests/run-all.sh

      - name: CLI 自检（usage × 分发 × 软链）
        run: sh scripts/ordo-selfcheck

      - name: 声明层自检（world 只允许裸 atom）
        run: |
          bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ {
            if ($0 ~ /#/ || NF != 1) print NR": "$0
          }' config/world)
          if [ -n "$bad" ]; then
            echo "config/world 含行内注释或多列行："
            echo "$bad"
            exit 1
          fi
          echo "config/world OK"
